<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таблица</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background: #f5f5f5; padding: 10px; }
        .header { text-align: center; padding: 15px; font-size: 20px; font-weight: bold; }
        .toolbar { display: flex; gap: 10px; padding: 10px; background: white; margin-bottom: 10px; border-radius: 8px; flex-wrap: wrap; }
        button { padding: 8px 16px; border: none; border-radius: 4px; background: #1976d2; color: white; cursor: pointer; }
        button:hover { background: #1565c0; }
        button.danger { background: #d32f2f; }
        button.danger:hover { background: #b71c1c; }
        .table-container { overflow-x: auto; background: white; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #e3f2fd; padding: 10px; font-weight: 600; color: #1976d2; position: relative; }
        th .del-btn { position: absolute; right: 2px; top: 2px; font-size: 10px; cursor: pointer; color: #d32f2f; display: none; }
        th:hover .del-btn { display: block; }
        td { border: 1px solid #e0e0e0; padding: 0; position: relative; }
        td .del-btn { position: absolute; left: 2px; top: 2px; font-size: 10px; cursor: pointer; color: #d32f2f; display: none; z-index: 10; }
        td:hover .del-btn { display: block; }
        input { width: 100%; height: 40px; border: none; padding: 8px; font-size: 14px; outline: none; background: transparent; }
        input:focus { background: #e3f2fd; }
        input.show-formula { color: #1976d2; font-style: italic; }
        .status { padding: 10px; color: #666; font-size: 12px; }
    </style>
</head>
<body>
    <div class="header">Таблица</div>
    <div class="toolbar">
        <button onclick="addRow()">+ Строка</button>
        <button onclick="removeRow()">- Строка</button>
        <button onclick="addCol()">+ Колонка</button>
        <button onclick="removeCol()">- Колонка</button>
        <button onclick="saveData()">Сохранить</button>
        <button class="danger" onclick="clearAll()">Очистить</button>
    </div>
    <div class="table-container">
        <table id="sheet">
            <thead><tr id="header-row"><th></th><th>A<span class="del-btn" onclick="removeColByIdx(0)">×</span></th><th>B<span class="del-btn" onclick="removeColByIdx(1)">×</span></th><th>C<span class="del-btn" onclick="removeColByIdx(2)">×</span></th><th>D<span class="del-btn" onclick="removeColByIdx(3)">×</span></th><th>E<span class="del-btn" onclick="removeColByIdx(4)">×</span></th></tr></thead>
            <tbody id="sheet-body"></tbody>
        </table>
    </div>
    <div class="status" id="status">Готово</div>

    <script>
        const sheet = {};
        let rows = 10, cols = 5;

        function init() {
            loadData();
            render();
        }

        function render() {
            const tbody = document.getElementById('sheet-body');
            tbody.innerHTML = '';

            for (let r = 0; r < rows; r++) {
                const tr = document.createElement('tr');
                const th = document.createElement('th');
                th.innerHTML = `${r + 1}<span class="del-btn" onclick="removeRowByIdx(${r})">×</span>`;
                tr.appendChild(th);

                for (let c = 0; c < cols; c++) {
                    const td = document.createElement('td');
                    const input = document.createElement('input');
                    const key = `${r},${c}`;
                    const cell = sheet[key] || {};
                    
                    // Показываем результат, но при фокусе — формулу
                    input.value = cell.computed || cell.value || '';
                    if (cell.formula) {
                        input.dataset.formula = cell.formula;
                    }

                    // При фокусе показываем формулу
                    input.onfocus = function() {
                        if (this.dataset.formula) {
                            this.value = this.dataset.formula;
                            this.classList.add('show-formula');
                        }
                    };

                    // При потере фокуса — сохраняем и показываем результат
                    input.onblur = function() {
                        const val = this.value;
                        this.classList.remove('show-formula');
                        
                        if (val.startsWith('=')) {
                            const result = calcFormula(val.slice(1));
                            sheet[key] = { formula: val, computed: result };
                            this.dataset.formula = val;
                            this.value = result;
                        } else {
                            sheet[key] = { value: val, computed: val };
                            delete this.dataset.formula;
                            this.value = val;
                        }
                        saveData();
                    };

                    // Enter = потеря фокуса
                    input.onkeydown = function(e) {
                        if (e.key === 'Enter') this.blur();
                    };

                    td.appendChild(input);
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            }
        }

        function calcFormula(expr) {
            try {
                let processed = expr.replace(/([A-Z]+)(\d+)/g, (m, col, row) => {
                    const c = col.charCodeAt(0) - 65;
                    const r = parseInt(row) - 1;
                    const key = `${r},${c}`;
                    const cell = sheet[key] || {};
                    const val = parseFloat(cell.computed || cell.value || 0);
                    return isNaN(val) ? 0 : val;
                });
                return eval(processed) || 0;
            } catch (e) {
                return '#ERROR';
            }
        }

        function saveData() {
            localStorage.setItem('sheet_data', JSON.stringify(sheet));
            localStorage.setItem('sheet_rows', rows);
            localStorage.setItem('sheet_cols', cols);
            document.getElementById('status').textContent = 'Сохранено ' + new Date().toLocaleTimeString();
        }

        function loadData() {
            const data = localStorage.getItem('sheet_data');
            if (data) Object.assign(sheet, JSON.parse(data));
            rows = parseInt(localStorage.getItem('sheet_rows')) || 10;
            cols = parseInt(localStorage.getItem('sheet_cols')) || 5;
        }

        function updateHeader() {
            const hr = document.getElementById('header-row');
            hr.innerHTML = '<th></th>';
            for (let i = 0; i < cols; i++) {
                hr.innerHTML += `<th>${String.fromCharCode(65 + i)}<span class="del-btn" onclick="removeColByIdx(${i})">×</span></th>`;
            }
        }

        function addRow() { rows++; render(); saveData(); }
        function removeRow() { if (rows > 1) { rows--; render(); saveData(); } }
        function removeRowByIdx(idx) { 
            if (rows > 1) {
                // Удаляем все ячейки этой строки
                for (let c = 0; c < cols; c++) delete sheet[`${idx},${c}`];
                // Сдвигаем оставшиеся
                for (let r = idx; r < rows - 1; r++) {
                    for (let c = 0; c < cols; c++) {
                        sheet[`${r},${c}`] = sheet[`${r+1},${c}`];
                        delete sheet[`${r+1},${c}`];
                    }
                }
                rows--;
                render();
                saveData();
            }
        }
        
        function addCol() { cols++; updateHeader(); render(); saveData(); }
        function removeCol() { if (cols > 1) { cols--; updateHeader(); render(); saveData(); } }
        function removeColByIdx(idx) {
            if (cols > 1) {
                // Удаляем все ячейки этой колонки
                for (let r = 0; r < rows; r++) delete sheet[`${r},${idx}`];
                // Сдвигаем оставшиеся
                for (let r = 0; r < rows; r++) {
                    for (let c = idx; c < cols - 1; c++) {
                        sheet[`${r},${c}`] = sheet[`${r},${c+1}`];
                        delete sheet[`${r},${c+1}`];
                    }
                }
                cols--;
                updateHeader();
                render();
                saveData();
            }
        }

        function clearAll() { 
            if (confirm('Очистить всю таблицу?')) { 
                Object.keys(sheet).forEach(k => delete sheet[k]); 
                saveData(); 
                render(); 
            } 
        }

        init();
    </script>
</body>
</html>
